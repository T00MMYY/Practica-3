<main class="min-h-screen bg-stone-100 flex items-center justify-center py-12 px-4">
  <div class="max-w-5xl w-full bg-white shadow-2xl flex flex-col md:flex-row overflow-hidden min-h-[600px]">
    
    <div class="md:w-1/2 relative bg-zinc-900 overflow-hidden">
      <img 
        src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&q=80&w=1000" 
        alt="Sneaker Culture" 
        class="absolute inset-0 w-full h-full object-cover opacity-70"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
      
      <div class="absolute bottom-10 left-10 right-10">
        <h2 class="text-4xl font-black text-white uppercase italic tracking-tighter leading-none">
          Hablemos de <br><span class="text-red-600">Sneakers.</span>
        </h2>
        <p class="text-zinc-300 mt-4 text-sm font-medium max-w-xs">
          ¿Dudas con tu talla? ¿Buscas un drop específico? Nuestro equipo está listo para ayudarte.
        </p>
      </div>
    </div>

    <div class="md:w-1/2 p-10 md:p-16 flex flex-col justify-center">
      <div class="mb-10">
        <h3 class="text-[10px] font-black uppercase tracking-[0.3em] text-red-600 mb-2">Contacto</h3>
        <p class="text-2xl font-black text-black uppercase tracking-tight">Envíanos un mensaje</p>
      </div>

      <form class="space-y-5">
        <div class="group border-b-2 border-zinc-100 focus-within:border-black transition-colors">
          <label class="block text-[9px] font-black uppercase tracking-widest text-zinc-400">Nombre</label>
          <input type="text" placeholder="Escribe tu nombre" 
            class="w-full bg-transparent py-3 text-sm focus:outline-none placeholder:text-zinc-300 font-medium">
        </div>

        <div class="group border-b-2 border-zinc-100 focus-within:border-black transition-colors">
          <label class="block text-[9px] font-black uppercase tracking-widest text-zinc-400">Email</label>
          <input type="email" placeholder="hola@tuemail.com" 
            class="w-full bg-transparent py-3 text-sm focus:outline-none placeholder:text-zinc-300 font-medium">
        </div>

        <div class="group border-b-2 border-zinc-100 focus-within:border-black transition-colors">
          <label class="block text-[9px] font-black uppercase tracking-widest text-zinc-400">Mensaje</label>
          <textarea rows="3" placeholder="¿En qué podemos ayudarte?" 
            class="w-full bg-transparent py-3 text-sm focus:outline-none placeholder:text-zinc-300 font-medium resize-none"></textarea>
        </div>

        <button type="submit" 
          class="w-full bg-black text-white py-4 mt-6 font-black uppercase tracking-widest text-[11px] hover:bg-red-600 transition-all duration-300 flex items-center justify-center gap-3">
          Enviar Formulario
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>

      <div class="mt-12 pt-8 border-t border-zinc-50 flex justify-between">
        <div>
          <p class="text-[9px] font-black uppercase text-zinc-400">Llámanos</p>
          <p class="text-xs font-bold mt-1">+34 900 123 456</p>
        </div>
        <div class="text-right">
          <p class="text-[9px] font-black uppercase text-zinc-400">Social</p>
          <p class="text-xs font-bold mt-1">@kickstore_es</p>
        </div>
      </div>
    </div>

  </div>
</main>
