<main class="min-h-[90vh] bg-gray-50 flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-sm border border-gray-100">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black tracking-tighter uppercase italic mb-2">KickStore</h1>
            <h2 class="text-xl font-semibold text-gray-800">Bienvenido de nuevo</h2>
            <p class="text-gray-500 text-sm mt-1">Inicia sesión para gestionar tus pedidos</p> 
        </div>

        <form class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Email</label>
                <input 
                    type="email" 
                    placeholder="ejemplo@correo.com" 
                    class="p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-black focus:border-transparent outline-none transition-all"
                    required> 
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold uppercase tracking-widest text-gray-400 ml-1">Contraseña</label>
                <input 
                    type="password" 
                    placeholder="••••••••" 
                    class="p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-black focus:border-transparent outline-none transition-all"
                    required>
            </div>

            <button 
                type="submit" 
                class="mt-4 bg-black text-white p-4 rounded-xl font-bold uppercase tracking-widest hover:bg-zinc-800 transition-all active:scale-95 shadow-lg shadow-zinc-200">
                Iniciar Sesión
            </button> 

            <div class="text-center mt-4">
                <p class="text-gray-500 text-sm">
                    ¿No tienes cuenta? 
                    <a routerLink="/register" class="text-black font-bold hover:underline ml-1">Regístrate</a> 
                </p>
            </div>
        </form>
    </div>
</main>
