<main class="min-h-screen bg-stone-50">
  
  <section class="relative bg-black text-white py-28 px-6 overflow-hidden">
    <div class="absolute top-0 right-0 -translate-y-1/2 translate-x-1/4 w-[500px] h-[500px] bg-red-900/20 rounded-full blur-[120px]"></div>
    
    <div class="max-w-6xl mx-auto text-center relative z-10">
        <span class="inline-block px-4 py-1.5 mb-6 text-[10px] font-black tracking-[0.3em] uppercase bg-red-600 text-white italic">
            Drop Exclusivo
        </span>
        <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter uppercase italic leading-[0.9]">
            CAMBIA TU <br> <span class="text-transparent stroke-white" style="-webkit-text-stroke: 1px white;">JUEGO.</span>
        </h1>
        <p class="text-zinc-400 text-lg md:text-xl mb-10 max-w-xl mx-auto font-medium leading-relaxed">
            Las siluetas que definieron una era. Encuentra las zapatillas que hablan por ti.
        </p>
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <button routerLink="/catalogo" class="bg-white text-black px-12 py-4 font-black uppercase tracking-tighter hover:bg-red-600 hover:text-white transition-all duration-300 transform active:scale-95">
                Comprar Ahora
            </button>
        </div>
    </div>
  </section>

  <section class="max-w-7xl mx-auto py-24 px-6">
    <div class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
      <div class="space-y-2">
        <h2 class="text-4xl font-black text-black uppercase italic tracking-tighter">Destacados</h2>
        <div class="h-1.5 w-20 bg-red-600"></div>
      </div>
      <a routerLink="/catalogo" class="group flex items-center gap-2 text-xs font-black uppercase tracking-widest text-zinc-500 hover:text-black transition-colors">
        Ver toda la colección 
        <span class="group-hover:translate-x-2 transition-transform">→</span>
      </a>
    </div>

    <ng-container *ngIf="featuredProducts | async as productos; else cargando">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10">
        
        <div *ngFor="let producto of productos" class="group">
          <div class="relative bg-zinc-100 aspect-[4/5] mb-6 overflow-hidden flex items-center justify-center p-8 border border-transparent group-hover:border-zinc-200 transition-all">
            <img
              [src]="producto.image_url || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff'"
              [alt]="producto.name"
              class="max-h-full w-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-700 ease-in-out"
            />
            
            <div class="absolute top-4 left-4 bg-black text-white text-[9px] font-black px-3 py-1 uppercase tracking-tighter italic">
                Limited Edition
            </div>

            <div class="absolute bottom-0 left-0 right-0 p-4 translate-y-full group-hover:translate-y-0 transition-transform duration-300 bg-white/80 backdrop-blur-sm">
                <button class="w-full bg-black text-white py-3 text-[10px] font-black uppercase tracking-widest hover:bg-red-600 transition-colors">
                    Añadir al carrito
                </button>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-start">
                <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest">
                    {{ producto.categories?.name || 'Lifestyle' }}
                </p>
            </div>
            <h3 class="text-lg font-black text-black uppercase tracking-tight leading-tight group-hover:text-red-600 transition-colors">
                {{ producto.name }}
            </h3>
            <p class="text-xl font-black text-red-600 italic">
                {{ producto.price | number:'1.2-2' }} €
            </p>
          </div>
        </div>

      </div>
    </ng-container>

    <ng-template #cargando>
      <div class="flex flex-col items-center justify-center py-32 space-y-4">
         <div class="w-12 h-12 border-4 border-zinc-200 border-t-red-600 rounded-full animate-spin"></div>
         <p class="text-[10px] font-black uppercase tracking-[0.3em] text-zinc-400">Buscando stock...</p>
      </div>
    </ng-template>
  </section>

</main>
